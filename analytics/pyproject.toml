[project]
name = "kurgu-analytics"
version = "0.0.0"
description = "Kurgu analytics: ingestion, canonical model, set pieces, metrics, recommendations"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kurgu_analytics"]
