name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests, migrations, OpenAPI)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Module boundaries
        run: uv run lint-imports
      - name: mypy --strict
        run: uv run mypy apps/api/src analytics/kurgu_analytics apps/api/tests
      - name: Tests
        run: uv run pytest --cov=kurgu_api --cov=kurgu_analytics --cov-report=term-missing
      - name: Migration cycle (upgrade, downgrade, upgrade)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "create database kurgu_cycle owner kurgu_owner"
          psql -h localhost -U postgres -d kurgu_cycle -c "alter schema public owner to kurgu_owner"
          cd apps/api
          export MIGRATIONS_DATABASE_URL=postgresql+asyncpg://kurgu_owner:test-owner@localhost:5432/kurgu_cycle
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: OpenAPI schema is up to date
        run: |
          uv run kurgu-openapi packages/api-client/openapi.json
          git diff --exit-code -- packages/api-client/openapi.json

  js:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Forbidden env names
        run: scripts/check-forbidden-env.sh
      - name: Generated API client is up to date
        run: |
          pnpm --filter @kurgu/api-client generate
          git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ci-build-only
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (docker compose + Playwright)
    runs-on: ubuntu-24.04
    needs: [python, js]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 32)|" .env
      - name: Start stack
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.ci.yml up --build -d
          scripts/wait-for-stack.sh
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.ci.yml run --rm migrate kurgu-seed
        env:
          COMPOSE_FILES: -f infra/docker-compose.yml -f infra/docker-compose.ci.yml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kurgu/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @kurgu/web e2e
        env:
          CI: "true"
          KURGU_DEV_USER_PASSWORD: change-me-dev-user
      - name: Compose logs
        if: failure()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.ci.yml ps -a
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.ci.yml logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - name: pip-audit
        run: |
          uv export --all-packages --frozen --no-hashes --no-emit-workspace --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict -r /tmp/requirements.txt
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --lockfile=uv.lock
      - name: Trivy (filesystem, misconfig and vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
