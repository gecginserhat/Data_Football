[project]
name = "kurgu-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "analytics"]

[tool.uv.sources]
kurgu-analytics = { workspace = true }
kurgu-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
  "import-linter>=2.1",
  "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/alembic/versions/*.py.bak"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "N", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "analytics"]
explicit_package_bases = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["arq.*", "asyncpg.*", "boto3.*", "botocore.*", "pandas.*", "pandera.*", "openpyxl.*", "scipy.*", "imageio_ffmpeg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["apps/api/tests", "analytics/tests"]

[tool.importlinter]
root_packages = ["kurgu_api", "kurgu_analytics"]

[[tool.importlinter.contracts]]
name = "Analytics must not depend on the API layer"
type = "forbidden"
source_modules = ["kurgu_analytics"]
forbidden_modules = ["kurgu_api"]

[[tool.importlinter.contracts]]
name = "Analytics modules are layered"
type = "layers"
layers = [
  "kurgu_analytics.reports",
  "kurgu_analytics.recs",
  "kurgu_analytics.metrics",
  "kurgu_analytics.setpieces",
  "kurgu_analytics.ingestion",
  "kurgu_analytics.canonical",
]
