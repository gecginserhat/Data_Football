[project]
name = "kurgu-api"
version = "0.0.0"
description = "Kurgu REST API and background worker (modular monolith, ADR-0001)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "kurgu-analytics",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.27",
  "arq>=0.26",
  "redis>=5.2",
  "boto3>=1.35",
  "python-multipart>=0.0.18",
  "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
kurgu-openapi = "kurgu_api.openapi:main"
kurgu-dev-identities = "kurgu_api.dev_identities:main"
kurgu-seed = "kurgu_api.league.seed:main"
kurgu-ingest = "kurgu_api.ingestion.jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kurgu_api"]
